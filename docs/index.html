<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gestion - Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        :root {
            --fond-principal: #1a1a2e;
            --fond-secondaire: #16213e;
            --fond-tertiaire: #0f3460;
            --texte-principal: #eaeaea;
            --texte-secondaire: #a0a0a0;
            --accent: #e94560;
        }

        body {
            margin: 0;
            background: var(--fond-principal);
            font-family: system-ui, sans-serif;
        }

        .entete {
            background: var(--fond-secondaire);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--accent);
        }

        .entete h1 {
            color: var(--texte-principal);
            margin: 0 0 0.3rem 0;
            font-size: 1.5rem;
        }

        .entete p {
            color: var(--texte-secondaire);
            margin: 0;
            font-size: 0.9rem;
        }

        .navigation {
            background: var(--fond-secondaire);
            padding: 0.8rem 2rem;
            display: flex;
            gap: 1.5rem;
            border-bottom: 1px solid var(--fond-tertiaire);
        }

        .navigation a {
            color: var(--texte-secondaire);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .navigation a:hover {
            color: var(--accent);
        }

        .swagger-ui { background: var(--fond-principal); }
        .swagger-ui .topbar { display: none; }
        .swagger-ui .info .title { color: var(--texte-principal); }
        .swagger-ui .info .description p { color: var(--texte-secondaire); }
        .swagger-ui .info .description code { background: var(--fond-tertiaire); color: var(--accent); padding: 2px 6px; border-radius: 4px; }
        .swagger-ui .scheme-container { background: var(--fond-secondaire); box-shadow: none; }
        .swagger-ui .opblock-tag { color: var(--texte-principal); border-bottom: 1px solid var(--fond-tertiaire); }
        .swagger-ui .opblock { background: var(--fond-secondaire); border: 1px solid var(--fond-tertiaire); border-radius: 4px; margin-bottom: 10px; }
        .swagger-ui .opblock .opblock-summary { border: none; }
        .swagger-ui .opblock .opblock-summary-method { border-radius: 4px; min-width: 70px; }
        .swagger-ui .opblock.opblock-post { border-color: #00d26a; background: rgba(0,210,106,0.1); }
        .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #00d26a; }
        .swagger-ui .opblock.opblock-get { border-color: #3498db; background: rgba(52,152,219,0.1); }
        .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #3498db; }
        .swagger-ui .opblock.opblock-put { border-color: #f39c12; background: rgba(243,156,18,0.1); }
        .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #f39c12; }
        .swagger-ui .opblock.opblock-delete { border-color: #e74c3c; background: rgba(231,76,60,0.1); }
        .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #e74c3c; }
        .swagger-ui .opblock .opblock-summary-path { color: var(--texte-principal); }
        .swagger-ui .opblock .opblock-summary-description { color: var(--texte-secondaire); }
        .swagger-ui .opblock-body { background: var(--fond-principal); }
        .swagger-ui .opblock-section-header { background: var(--fond-tertiaire); }
        .swagger-ui .opblock-section-header h4 { color: var(--texte-principal); }
        .swagger-ui table thead tr th { color: var(--texte-principal); border-bottom: 1px solid var(--fond-tertiaire); }
        .swagger-ui table tbody tr td { color: var(--texte-secondaire); border-bottom: 1px solid var(--fond-tertiaire); }
        .swagger-ui .parameter__name { color: var(--texte-principal); }
        .swagger-ui .parameter__type { color: var(--accent); }
        .swagger-ui .btn.execute { background: var(--accent); border-color: var(--accent); }
        .swagger-ui .btn.authorize { background: #00d26a; border-color: #00d26a; }
        .swagger-ui select, .swagger-ui input[type="text"], .swagger-ui textarea { background: var(--fond-tertiaire); color: var(--texte-principal); border: 1px solid var(--fond-tertiaire); }
        .swagger-ui .model { color: var(--texte-secondaire); }
        .swagger-ui .model-title { color: var(--texte-principal); }
        .swagger-ui .prop-type { color: var(--accent); }
        .swagger-ui .microlight { background: var(--fond-tertiaire) !important; color: var(--texte-principal) !important; }
        .swagger-ui section.models { border: 1px solid var(--fond-tertiaire); border-radius: 4px; }
        .swagger-ui section.models h4 { color: var(--texte-principal); }

        .pied {
            background: var(--fond-secondaire);
            padding: 1rem;
            text-align: center;
            border-top: 1px solid var(--fond-tertiaire);
            margin-top: 2rem;
        }

        .pied a {
            color: var(--accent);
            text-decoration: none;
        }

        .pied p {
            color: var(--texte-secondaire);
            margin: 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="entete">
        <h1>API de Gestion d'Équipe</h1>
        <p>Joueurs, Matchs, Feuilles de match, Statistiques</p>
    </div>

    <nav class="navigation">
        <a href="#tag/Joueurs">Joueurs</a>
        <a href="#tag/Matchs">Matchs</a>
        <a href="#tag/Feuilles-de-match">Feuilles de match</a>
        <a href="#tag/Statistiques">Statistiques</a>
        <a href="https://alfred.alwaysdata.net/docs/">API Auth</a>
    </nav>

    <div id="swagger-ui"></div>

    <div class="pied">
        <p><a href="https://alfred.alwaysdata.net/docs/">Documentation API Authentification</a></p>
    </div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        SwaggerUIBundle({
            url: "openapi.yaml",
            dom_id: '#swagger-ui',
            deepLinking: true,
            defaultModelsExpandDepth: 0,
            docExpansion: "list",
            persistAuthorization: true
        });
    </script>
</body>
</html>
